<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wix Image Optimizer</title>
    <meta
      name="description"
      content="Shrink photos for upload to Wix without visible quality loss. Runs entirely in your browser — nothing is uploaded."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      // Deliberately duplicates the small core of src/lib/theme.ts: importing
      // a module here would run after the first paint, which is the whole
      // thing we are avoiding. Keep the two in step.
      (function () {
        try {
          var stored = localStorage.getItem("wix-image-optimizer:theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* localStorage can throw in private mode; fall through to light. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
