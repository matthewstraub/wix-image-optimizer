# Render Blueprint — https://render.com/docs/blueprint-spec
#
# A static site. All the image work happens in the visitor's browser, so there
# is no server to run and nothing is ever uploaded.
services:
  - type: web
    name: wix-image-optimizer
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      # The codec WebAssembly is several megabytes and content-hashed, so it
      # should be cached hard. The HTML must not be, or a redeploy stays
      # invisible until the edge cache expires.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Both paths are needed. Render matches these rules against the *request*
      # path, not the file it resolves to, so a rule for /index.html alone does
      # nothing for visitors — who all request "/" and silently get Render's
      # default of `public, max-age=0, s-maxage=300` instead. Confirmed against
      # the live deploy: /index.html came back no-cache and / did not.
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
